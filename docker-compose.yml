# Base compartida por desarrollo y producción.
# Desarrollo:  docker compose up -d
# Producción:  docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
name: gs_control_center

x-app-base: &app-base
  build:
    context: .
    dockerfile: docker/Dockerfile.api
    target: runner
  env_file: [.env]
  depends_on:
    postgres: { condition: service_healthy }
    redis:    { condition: service_healthy }
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:

  # ---------- Infraestructura ----------
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: gs_control_center
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=2GB
      - -c
      - max_connections=80
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_command=test ! -f /wal/%f && cp %p /wal/%f
    volumes:
      - pgdata:/var/lib/postgresql/data
      - pgwal:/wal
      - ./db_postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d gs_control_center"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # noeviction es deliberado: perder un job de BullMQ es perder una venta.
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 1gb --maxmemory-policy noeviction --appendonly yes
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ---------- Aplicación ----------
  api:
    <<: *app-base
    command: ["node", "dist/main.js", "--role=api"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Separado a propósito: los picos de webhooks en un lanzamiento no deben
  # competir con las consultas del dashboard, ni caerse con ellas.
  ingest:
    <<: *app-base
    command: ["node", "dist/main.js", "--role=ingest"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    <<: *app-base
    command: ["node", "dist/main.js", "--role=worker"]
    healthcheck:
      test: ["CMD", "node", "dist/health/worker-probe.js"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
      target: runner
    env_file: [.env]
    depends_on: [api]
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Job de un solo uso. No arranca con el resto: se ejecuta explícitamente.
  #   docker compose run --rm migrate
  migrate:
    <<: *app-base
    command: ["pnpm", "prisma", "migrate", "deploy"]
    restart: "no"
    profiles: [tools]
    healthcheck: { disable: true }

  # ---------- Servicios de apoyo (perfiles opcionales) ----------
  n8n:
    image: n8nio/n8n:latest
    env_file: [.env]
    volumes: [n8ndata:/home/node/.n8n]
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped
    profiles: [automation]

  docs:
    build:
      context: .
      dockerfile: docker/Dockerfile.docs
    restart: unless-stopped
    profiles: [docs]

volumes:
  pgdata:
  pgwal:
  redisdata:
  n8ndata:
