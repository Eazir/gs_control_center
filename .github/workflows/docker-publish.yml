name: Build and Publish Docker Images

on:
  push:
    branches:
      - main
      - master
  # Permite ejecutar el flujo manualmente desde la interfaz de GitHub
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Se usa el nombre del propietario o de la organización (ej: growthshell)
  # automáticamente y en minúsculas.
  # Convertimos el owner a minúsculas, por si tiene mayúsculas (ej: Eazir -> eazir)
  # ya que Docker no permite nombres de repositorios con mayúsculas.
  IMAGE_API: ghcr.io/eazir/gs-api
  IMAGE_WEB: ghcr.io/eazir/gs-web

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Necesario para poder subir imágenes a GHCR

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # --- Construir y Subir API ---
      - name: Extract metadata (tags, labels) for API
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_API }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.api
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- Construir y Subir Web ---
      - name: Extract metadata (tags, labels) for Web
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_WEB }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push Web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.web
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
